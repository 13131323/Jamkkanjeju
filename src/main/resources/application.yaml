spring:
  application:
    name: server-spring

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        # 엔티티/필드명(camelCase) -> 소문자 snake_case 테이블/컬럼명 (예: CultureMissionQuiz -> culture_mission_quiz)
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  sql:
    init:
      mode: never

management:
  endpoint:
    health:
      show-details: always  # health 상세내용까지 항상 공개
  endpoints:
    web:
      exposure:
        include: health,info  # http://localhost:8080/actuator/health 이런식으로 사용 가능

logging:
  level:
    org.hibernate.SQL: debug
