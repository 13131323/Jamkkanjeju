spring:
  application:
    name: server-spring

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        # 엔티티/필드명(camelCase) -> 소문자 snake_case 테이블/컬럼명 (예: CultureMissionQuiz -> culture_mission_quiz)
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  sql:
    init:
      mode: never

app:
  jwt:
    # 32바이트 이상의 키를 Base64로 인코딩한 값을 환경변수로 주입한다.
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

springdoc:
  swagger-ui:
    path: /docs   # http://localhost:8080/docs 로 Swagger UI 접속

management:
  endpoint:
    health:
      show-details: always  # health 상세내용까지 항상 공개
  endpoints:
    web:
      exposure:
        include: health,info  # http://localhost:8080/actuator/health 이런식으로 사용 가능

logging:
  level:
    org.hibernate.SQL: debug
