services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tour}
      MYSQL_USER: ${MYSQL_USER:-tour}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tour_password}
      TZ: Asia/Seoul
      # 한글이 깨지지 않도록 UTF-8 로케일 지정
      LANG: C.UTF-8
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 볼륨이 비어있을 때(최초 생성 시)만 파일명 알파벳 순으로 실행된다: DDL -> 목데이터
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scripts/data_init.sql:/docker-entrypoint-initdb.d/02_data_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tour}
      MYSQL_USER: ${MYSQL_USER:-tour}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tour_password}
      TZ: Asia/Seoul
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
